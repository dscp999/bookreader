<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>북리더</title><link rel="stylesheet" href="style.css"></head>
<body class="t-dark">
<section id="lib">
  <header><h1>내 책꽂이</h1><div class="hb"><select id="sort"><option value="recent">최근 읽은 순</option><option value="added">추가한 순</option><option value="title">제목 순</option><option value="pct">진행률 순</option></select><button id="viewBtn">목록</button><button id="autoBtn" hidden>자동표지: 켬</button><button id="editBtn">편집</button><label class="btn plus">+ 책 추가<input id="file" type="file" accept=".epub,.txt,application/epub+zip,text/plain" multiple hidden></label></div></header>
  <div id="grid" class="shelf"></div>
  <p id="empty">EPUB 또는 TXT 파일을 추가하세요.<br>한글 TXT(EUC-KR/UTF-8)는 자동 인식됩니다.</p>
</section>
<div id="cov" class="sheet fx" hidden><h3 id="covT">표지 찾기</h3>
 <div class="row"><input id="covQ" type="text" placeholder="책 제목"><button id="covGo">검색</button></div>
 <div id="covMsg" class="msg"></div><div id="covRes" class="covres"></div>
 <div class="row"><label class="btn">내 이미지 선택<input id="covFile" type="file" accept="image/*" hidden></label><button id="covDel">기본 표지</button><button id="covClose">닫기</button></div></div>
<section id="reader" hidden>
  <div id="top" class="bar"><button id="back">←</button><span id="title"></span><button id="bmBtn">★</button><button id="listBtn">목록</button><button id="setBtn">Aa</button></div>
  <div id="stage"><div id="viewer"></div><div id="txt" hidden><div id="txtin"></div></div>
    <div class="zone l" data-d="-1"></div><div class="zone c"></div><div class="zone r" data-d="1"></div></div>
  <div id="bottom" class="bar"><input id="seek" type="range" min="0" max="1000" value="0"><span id="pct">0%</span></div>
  <div id="panel" class="sheet" hidden>
    <h3>보기 설정</h3>
    <div class="row">테마<span id="themes"><button data-t="light">밝게</button><button data-t="sepia">세피아</button><button data-t="dark">어둡게</button><button data-t="black">검정</button></span></div>
    <div class="row">글자 크기<input id="fs" type="range" min="12" max="40" step="1"></div>
    <div class="row">줄 간격<input id="lh" type="range" min="1.2" max="2.4" step="0.1"></div>
    <div class="row">여백<input id="mg" type="range" min="0" max="60" step="4"></div>
    <div class="row">글꼴<select id="ff"><option value="serif">명조(serif)</option><option value="sans-serif">고딕(sans)</option><option value="monospace">고정폭</option></select></div>
    <div class="row">넘김 방식<select id="flow"><option value="paginated">페이지</option><option value="scrolled">스크롤</option></select></div>
    <button class="btn" id="closeP">닫기</button>
  </div>
  <div id="list" class="sheet" hidden><h3>목차 / 북마크</h3><div id="listbody"></div><button class="btn" id="closeL">닫기</button></div>
</section>
<script src="jszip.min.js"></script><script src="epub.min.js"></script><script src="app.js"></script>
</body></html>
